name: CI do Quiz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testar pontuacao
    runs-on: ubuntu-latest

    steps:
      - name: Buscar codigo do repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Executar testes
        run: npm test
